<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celcia AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="celcia-background" aria-hidden="true"></canvas>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-content">
                <div class="brand">
                    <h1 class="brand-text">Celcia.</h1>
                </div>
                
                <button class="new-chat-btn" id="newChatBtn">
                    <span class="plus-icon">+</span>
                    <span>New chat</span>
                </button>
                <button class="memory-btn" id="memoryBtn">What I remember</button>
                
                <div class="recent-section">
                    <h2 class="recent-label">RECENT</h2>
                    <div class="chat-list" id="chatList">
                        <!-- Chat items will be populated dynamically -->
                    </div>
                    <section class="memory-panel hidden" id="memoryPanel" aria-label="Celcia memories">
                        <div class="memory-panel-header">
                            <h2>What Celcia remembers</h2>
                            <button id="closeMemoryBtn" class="menu-btn">Close</button>
                        </div>
                        <div id="memoryList"></div>
                        <button id="clearMemoryBtn" class="memory-clear-btn">Clear memories</button>
                    </section>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-info">
                    <h1 class="header-title">Celcia AI</h1>
                    <p class="header-subtitle">Online · OpenRouter</p>
                </div>
                <div class="auth-controls">
                    <span id="sessionStatus">Sign in required</span>
                    <button class="menu-btn" id="loginBtn" aria-label="Sign in">Sign in</button>
                    <button class="menu-btn hidden" id="logoutBtn" aria-label="Sign out">Sign out</button>
                </div>
                <button class="menu-btn" aria-label="Menu">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="2" fill="currentColor"/>
                        <circle cx="10" cy="4" r="2" fill="currentColor"/>
                        <circle cx="10" cy="16" r="2" fill="currentColor"/>
                    </svg>
                </button>
            </header>
            <form class="auth-panel hidden" id="authPanel">
                <input id="authEmail" type="email" placeholder="Email" autocomplete="email" required>
                <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
                <span id="authError" role="alert"></span>
            </form>
            
            <!-- Conversation Area -->
            <div class="conversation-area">
                <div class="conversation-header" id="conversationHeader">
                    <h2 class="conversation-title" id="conversationTitle">New conversation</h2>
                    <p class="conversation-subtitle" id="conversationSubtitle">Start a new chat</p>
                </div>
                
                <div class="messages-container" id="messagesContainer">
                    <!-- Messages will be populated dynamically -->
                    <div class="empty-state" id="emptyState">
                        <h2 class="empty-title">How can I help?</h2>
                    </div>
                </div>
            </div>
            
            <!-- Composer Area -->
            <div class="composer-area">
                <div class="composer">
                    <button class="composer-action-btn" aria-label="Add attachment">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    
                    <textarea 
                        class="composer-input" 
                        id="composerInput" 
                        placeholder="Ask Celcia anything..."
                        rows="1"
                    ></textarea>
                    
                    <button class="composer-action-btn" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M14 14L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    
                    <button class="send-btn" id="sendBtn" aria-label="Send message">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M3 10L17 3L10 10L17 17L3 10Z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
                
                <p class="composer-helper">Enter to send · / for commands</p>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
