            /* ============ Attachments ============ */
            var attached = [];
            function fmtSize(b) {
                return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
            }
            function renderAttachments() {
                attachRow.innerHTML = '';
                if (!attached.length) { attachRow.classList.add('hidden'); return; }
                attachRow.classList.remove('hidden');
                attached.forEach(function (f, i) {
                    var chip = el('div', 'attach-chip');
                    chip.appendChild(el('span', null, f.name));
                    chip.appendChild(el('span', 'sz', fmtSize(f.size)));
                    var x = el('button');
                    x.type = 'button';
                    x.setAttribute('aria-label', 'Remove ' + f.name);
                    x.innerHTML = X_SVG;
                    x.addEventListener('click', function () {
                        attached.splice(i, 1); renderAttachments(); updateSend();
                    });
                    chip.appendChild(x);
                    attachRow.appendChild(chip);
                });
            }
            $('attachBtn').addEventListener('click', function () { fileInput.click(); });
            fileInput.addEventListener('change', function () {
                Array.prototype.forEach.call(fileInput.files, function (f) { attached.push(f); });
                renderAttachments();
                fileInput.value = '';
                updateSend();
            });

            /* ============ Composer ============ */
            function updateSend() {
                var ready = input.value.trim().length > 0 || attached.length > 0;
                sendBtn.classList.toggle('ready', ready);
                sendBtn.disabled = !ready;
            }
            input.addEventListener('input', function () {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 160) + 'px';
                updateSend();
            });
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
            });
            sendBtn.addEventListener('click', send);

            document.addEventListener('keydown', function (e) {
                if (e.key === '/' && document.activeElement !== input) {
                    var t = e.target.tagName;
                    if (t !== 'INPUT' && t !== 'TEXTAREA') { e.preventDefault(); input.focus(); }
                }
                if (e.key === 'Escape') {
                    $('authPop').classList.add('hidden');
                    $('memoryPop').classList.add('hidden');
                    $('memoryBtn').classList.remove('on');
                    closeSidebar();
                }
            });

            /* ============ Send ============ */
            var busy = false;
            function send() {
                if (busy) return;
                var text = input.value.trim();
                if (!text && !attached.length) return;
                busy = true;

                var chat = activeChat() || createChat(true);
                var isNew = chat.messages.length === 0;

                var msg = { role: 'user', text: text || '(attachments)', time: now() };
                if (attached.length) msg.files = attached.map(function (f) { return f.name; });
                chat.messages.push(msg);

                if (isNew) {
                    chat.title = titleFrom(text || msg.files[0]);
                    renderSidebar();
                    renderThread();
                } else {
                    if (scroll.contains(emptyState)) {
                        scroll.innerHTML = '';
                    } else if (scroll.children.length) {
                        var b = el('div', 'break');
                        b.appendChild(el('i'));
                        scroll.appendChild(b);
                    }
                    scroll.appendChild(buildMessage(msg));
                }
                syncHeader();

                var files = attached.map(function (f) { return f.name; });
                input.value = ''; input.style.height = 'auto';
                attached = []; renderAttachments(); updateSend();
                pin();

                var reply = pickReply(text, files);
                var thinker = showThinking();
                setTimeout(function () {
                    thinker.remove();
                    chat.messages.push({ role: 'assistant', text: reply, time: now() });
                    printReply(reply);
                    busy = false;
                }, 700 + Math.random() * 600);
            }

            /* ============ Index entries ============ */
            $('entries').addEventListener('click', function (e) {
                var btn = e.target.closest('.entry');
                if (!btn) return;
                input.value = btn.querySelector('span').textContent;
                input.dispatchEvent(new Event('input'));
                input.focus();
            });

            /* ============ Dictation ============ */
            var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            var rec = null, recording = false;
            $('micBtn').addEventListener('click', function () {
                if (!SR) { toast('Voice input is not available in this browser'); return; }
                if (recording) { rec.stop(); return; }
                rec = new SR();
                rec.lang = navigator.language || 'en-US';
                rec.interimResults = true;
                rec.continuous = false;
                var base = input.value ? input.value + ' ' : '';
                rec.onresult = function (e) {
                    var t = '';
                    for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
                    input.value = base + t;
                    input.dispatchEvent(new Event('input'));
                };
                rec.onstart = function () {
                    recording = true;
                    $('micBtn').classList.add('rec');
                    $('micBtn').setAttribute('aria-pressed', 'true');
                    statusRow.classList.add('rec');
                    statusRow.innerHTML = '<span class="rec-dot"></span>Listening\u2026';
                };
                rec.onend = rec.onerror = function () {
                    recording = false;
                    $('micBtn').classList.remove('rec');
                    $('micBtn').setAttribute('aria-pressed', 'false');
                    statusRow.classList.remove('rec');
                    statusRow.innerHTML = '';
                };
                rec.start();
            });

            /* ============ Sign the book (auth) ============ */
            var authPop = $('authPop'), authBtn = $('authBtn');
            authBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (session) { signOut(); return; }
                var hidden = authPop.classList.contains('hidden');
                authPop.classList.toggle('hidden');
                if (hidden) $('authEmail').focus();
            });
            document.addEventListener('click', function (e) {
                if (!authPop.classList.contains('hidden') &&
                    !authPop.contains(e.target) && !authBtn.contains(e.target)) {
                    authPop.classList.add('hidden');
                }
            });
            $('authForm').addEventListener('submit', function (e) {
                e.preventDefault();
                var email = $('authEmail').value.trim(), pw = $('authPassword').value;
                var err = $('authErr');
                if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'That email does not look right — check it once more.'; return; }
                if (pw.length < 4) { err.textContent = 'At least four characters for the password, please.'; return; }
                err.textContent = '';
                session = { email: email, name: email.split('@')[0] };
                applySession();
                authPop.classList.add('hidden');
                $('authPassword').value = '';
                toast('Signed the book as ' + session.name);
            });
            function initials(name) {
                return name.split(/[\s._-]+/).slice(0, 2).map(function (p) { return p[0] || ''; }).join('').toUpperCase() || 'C';
            }
            function applySession() {
                if (session) {
                    authBtn.textContent = 'Account';
                    $('accountBlock').classList.remove('hidden');
                    $('avatarEl').textContent = initials(session.name);
                    $('acctName').textContent = session.name;
                    $('acctMail').textContent = session.email;
                } else {
                    authBtn.textContent = 'Sign in';
                    $('accountBlock').classList.add('hidden');
                }
            }
            function signOut() {
                session = null;
                applySession();
                toast('Signed out — the book stays put');
            }
            $('signOutSide').addEventListener('click', signOut);

            /* ============ The ledger (memory) ============ */
            var memories = [
                { text: 'Prefers short answers — gets to the point quickly.', day: 'Mar 12' },
                { text: 'Working on a personal project, usually in the evenings.', day: 'Mar 08' },
                { text: 'Reads carefully — likes sources named outright.', day: 'Feb 27' }
            ];
            function renderMemory() {
                var list = $('memList');
                list.innerHTML = '';
                if (!memories.length) {
                    list.appendChild(el('p', 'list-empty', 'Nothing kept yet — it comes with conversation.'));
                    return;
                }
                memories.forEach(function (m, i) {
                    var row = el('div', 'ledger-item');
                    row.style.animationDelay = (i * 60) + 'ms';
                    row.appendChild(el('span', null, m.text));
                    row.appendChild(el('small', null, m.day));
                    list.appendChild(row);
                });
            }
            renderMemory();
            $('memoryBtn').addEventListener('click', function () {
                var pop = $('memoryPop');
                var hidden = pop.classList.contains('hidden');
                pop.classList.toggle('hidden');
                this.classList.toggle('on', hidden);
                this.setAttribute('aria-pressed', String(hidden));
            });
            $('memClear').addEventListener('click', function () {
                memories = [];
                renderMemory();
                toast('Ledger cleared');
            });

            input.focus();
        })();
    </script>
</body>

</html>
